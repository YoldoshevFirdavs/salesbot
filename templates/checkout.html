<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtmani Tekshirish - SalesBot</title>
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px 0 60px 0;
        }
        
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 50px;
            margin-top: 30px;
            animation: fadeInDown 0.6s ease;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header-section h1 {
            font-size: 36px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .header-section p {
            color: var(--text-secondary);
            font-size: 17px;
            margin: 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            animation: slideRight 0.8s ease;
        }
        
        @keyframes slideRight {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }
        
        .checkout-content {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            animation: fadeIn 0.6s ease 0.2s both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .cart-items {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 0;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }
        
        .cart-header {
            padding: 24px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            position: relative;
            overflow: hidden;
        }
        
        .cart-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        
        .cart-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        
        .cart-item {
            padding: 24px;
            border-bottom: 1px solid var(--border-light);
            display: grid;
            grid-template-columns: 90px 1fr 110px;
            gap: 20px;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .cart-item:hover {
            background: var(--accent-light);
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        
        .item-image {
            width: 90px;
            height: 90px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .cart-item:hover .item-image {
            transform: scale(1.08);
        }
        
        .item-details h3 {
            margin: 0 0 6px 0;
            font-size: 17px;
            color: var(--text-primary);
            font-weight: 700;
        }
        
        .item-details p {
            margin: 3px 0;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.4;
        }
        
        .item-price {
            font-weight: 800;
            font-size: 20px;
            color: var(--accent-primary);
            text-align: right;
        }
        
        .item-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .quantity-adjuster {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 6px;
            width: fit-content;
        }
        
        .qty-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .qty-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .qty-btn:active {
            transform: scale(0.95);
        }
        
        .qty-display {
            min-width: 40px;
            text-align: center;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 15px;
        }
        
        .item-remove {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger);
            border: 1px solid rgba(220, 53, 69, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .item-remove:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        
        .summary {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: sticky;
            top: 100px;
            height: fit-content;
            border: 1px solid var(--border-light);
            animation: fadeInUp 0.6s ease 0.3s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .summary h3 {
            margin: 0 0 24px 0;
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 700;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }
        
        .summary-row.total {
            border: none;
            padding: 16px 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            margin: 0 -28px;
            padding: 16px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 22px;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }
        
        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
            position: relative;
            overflow: hidden;
        }
        
        .checkout-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.35);
        }
        
        .checkout-btn:hover::before {
            left: 100%;
        }
        
        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .empty-cart {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-secondary);
        }
        
        .empty-cart-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .empty-cart h2 {
            font-size: 26px;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 700;
        }
        
        .empty-cart p {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0;
        }
        
        @media (max-width: 900px) {
            .checkout-content {
                grid-template-columns: 1fr;
            }
            
            .summary {
                position: static;
            }
        }
        
        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 28px;
            }
            
            .cart-item {
                grid-template-columns: 70px 1fr;
                gap: 14px;
            }
            
            .item-price {
                grid-column: 1 / -1;
                text-align: left;
                margin-top: 8px;
            }
            
            .item-controls {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>
<body>
    {% include "header.html" %}
    
    <main>
        <div class="header-section">
            <h1>🛒 Buyurtmani Tekshirish</h1>
            <p>Mahsulotlarni o'ngaytiring va tulovni amalga oshiring</p>
        </div>
        
        <div class="progress-bar">
            <div class="progress-bar-fill"></div>
        </div>
        
        <div class="checkout-content">
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>
            
            <div class="summary">
                <h3>📊 Jami Summa</h3>
                <div class="summary-row">
                    <span>Mahsulotlar:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Yetkazib berish:</span>
                    <span>$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Jami:</span>
                    <span id="total">$0.00</span>
                </div>
                
                <button class="checkout-btn" onclick="proceedToPayment()" id="checkoutBtn">
                    💳 Tulovga O'tish
                </button>
            </div>
        </div>
    </main>
    
    <script>
        const cartData = JSON.parse('{{ cart_json|escapejs }}');
        const orderData = {{ order_json|safe }};
        
        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (!cartData || Object.keys(cartData).length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Savatingiz bo'sh</h2>
                        <p>Mahsulot qo'shib to'rovang</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="cart-header"><h2>🛍️ Savatchadagi Mahsulotlar</h2></div>';
            let total = 0;
            
            for (const [productId, item] of Object.entries(cartData)) {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="item-image">
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <p>${item.description || ''}</p>
                        </div>
                        <div>
                            <div class="item-price">$${itemTotal.toFixed(2)}</div>
                            <div class="item-controls">
                                <div class="quantity-adjuster">
                                    <button class="qty-btn" onclick="updateQty(${productId}, -1)">−</button>
                                    <span class="qty-display">${item.quantity}</span>
                                    <button class="qty-btn" onclick="updateQty(${productId}, 1)">+</button>
                                </div>
                                <button class="item-remove" onclick="removeItem(${productId})">🗑 O'chirish</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            updateTotals(total);
        }
        
        function updateQty(productId, change) {
            const newQty = cartData[productId].quantity + change;
            if (newQty > 0) {
                cartData[productId].quantity = newQty;
                renderCart();
            }
        }
        
        function removeItem(productId) {
            delete cartData[productId];
            renderCart();
        }
        
        function updateTotals(total) {
            document.getElementById('subtotal').textContent = '$' + total.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
        }
        
        function proceedToPayment() {
            if (Object.keys(cartData).length === 0) {
                alert('Savatingiz bo\'sh!');
                return;
            }
            
            fetch('/checkout/{{ order_id }}/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ cart: cartData })
            }).then(r => {
                if (r.ok) window.location.href = r.url;
            });
        }
        
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        
        renderCart();
    </script>
</body>
</html>
