services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost:8000,localhost,127.0.0.1:8000,127.0.0.1}
      - PYTHONUNBUFFERED=1
      - LOG_FILE=/app/logs/django.log
      - IS_DOCKER=true
      - DB_HOST=db
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  tgbot:
     build: .
     restart: always
     command: python tgbot/tgb/runbot.py
     dns:
       - 8.8.8.8
       - 1.1.1.1
     volumes:
       - .:/app
       - media_volume:/app/media
     env_file:
       - .env
     environment:
       - PYTHONUNBUFFERED=1
     depends_on:
       db:
         condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume: